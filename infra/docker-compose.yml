services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gitflow
      POSTGRES_PASSWORD: gitflow
      POSTGRES_DB: gitflow
    ports: ["5433:5432"]
    volumes: [gitflow-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitflow -d gitflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  object-storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: miniosecret
    ports: ["9000:9000", "9001:9001"]
    volumes: [gitflow-minio:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gitflow-postgres:
  gitflow-minio:
