services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gitflow
      POSTGRES_PASSWORD: gitflow
      POSTGRES_DB: gitflow
    ports: ["5432:5432"]
    volumes: [gitflow-postgres:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["9000:9000", "9001:9001"]
    volumes: [gitflow-minio:/data]
volumes:
  gitflow-postgres:
  gitflow-minio:
